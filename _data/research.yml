- title: Genetics of OCD and Tourette Disorder
  summary: >
    We use exome, genome, and population-scale datasets to identify genes and
    variants that contribute to obsessive-compulsive disorder, Tourette disorder,
    and related early-onset neuropsychiatric conditions.
  methods:
    - Human Genetics
    - Rare Variant Analysis
    - Cohort and Consortium Data
- title: Functional Genomics of Brain Development
  summary: >
    We connect genetic findings to gene regulation, cell types, and developmental
    contexts to understand where risk genes act and what pathways they may affect.
  methods:
    - Single-Cell Data
    - Regulatory Genomics
    - Developmental Maps
- title: Systems Biology and Translation
  summary: >
    We work with collaborators to move from statistical findings toward
    biological models, clinical interpretation, and testable therapeutic
    hypotheses.
  methods:
    - Variant Prioritization
    - Pathway Modeling
    - Collaborative Experiments
