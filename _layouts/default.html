<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}">
    <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ '/favicon.png' | relative_url }}" type="image/png" sizes="96x96">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% feed_meta %}
    {% seo title=false %}
    {% assign social_image = page.image | default: '/assets/img/share-card.png' %}
    {% assign social_image_alt = page.image_alt | default: 'Belinda Wang Lab logo and site preview' %}
    <meta property="og:image" content="{{ social_image | absolute_url }}">
    <meta property="og:image:secure_url" content="{{ social_image | absolute_url }}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ social_image_alt }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ social_image | absolute_url }}">
    <meta name="twitter:image:alt" content="{{ social_image_alt }}">
  </head>
  <body>
    {% include site-header.html %}
    <main id="main-content">
      {{ content }}
    </main>
    {% include site-footer.html %}
  </body>
</html>
